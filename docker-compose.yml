services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - DATABASE_URL=file:/data/db.sqlite
      - NODE_ENV=production
    volumes:
      - /opt/swarm-arena/data:/data
    ports:
      - "127.0.0.1:3000:3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
