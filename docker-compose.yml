services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - DATABASE_URL=file:/data/db.sqlite
      - NODE_ENV=production
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_GITHUB_ID=${AUTH_GITHUB_ID}
      - AUTH_GITHUB_SECRET=${AUTH_GITHUB_SECRET}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - GITHUB_FEEDBACK_TOKEN=${GITHUB_FEEDBACK_TOKEN}
      # next-auth v5 rejects every session with "UntrustedHost" without this,
      # since there's no AUTH_URL configured and the app sits behind Caddy's
      # reverse proxy — see https://errors.authjs.dev#untrustedhost.
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST}
    volumes:
      - /opt/swarm-arena/data:/data
    ports:
      - "127.0.0.1:3000:3000"
    # F-07: defense-in-depth against an unbounded-growth bug (e.g. a future
    # per-tick array that forgets to cap itself) — not a tight budget
    # against today's known (small) per-run memory cost, which measured in
    # the single-digit MB range. 4GB leaves ~3.7GiB headroom for the OS,
    # Caddy, and normal request handling on this VPS's 7.7GiB, no-swap
    # machine (confirmed 2026-11-15). This is the plain-Compose `mem_limit`
    # shorthand, not `deploy.resources.limits.memory` — that key is a
    # documented Swarm-only no-op under `docker compose` (this project uses
    # plain Compose, not Swarm mode) and would silently do nothing here.
    mem_limit: 4g

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      # Host-mounted so the VPS's own fail2ban can tail it directly,
      # without reaching into the container.
      - /opt/swarm-arena/logs/caddy:/var/log/caddy
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
