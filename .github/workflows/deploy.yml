name: Deploy to VPS

on:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # SKIP_ENV_VALIDATION mirrors the Dockerfile's build stage (see
      # context/deployment/deploy-plan.md) — this build is only here to
      # generate .next/types for typecheck; it never runs with real secrets.
      - name: Build (type generation)
        env:
          SKIP_ENV_VALIDATION: "1"
        run: npm run build
      - run: npm run typecheck
      - run: npm run check
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key szef@217.154.238.241
