name: Deploy to VPS

on:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # SKIP_ENV_VALIDATION mirrors the Dockerfile's build stage (see
      # context/deployment/deploy-plan.md) — this build is only here to
      # generate .next/types for typecheck; it never runs with real secrets.
      # next build executes server code during static page-data collection
      # (e.g. /_not-found), which touches the db client singleton at module
      # load — so DATABASE_URL etc. must resolve even though validation is
      # skipped. Values mirror vitest.config.ts's own test env, which exists
      # for the same self-contained-build reason.
      - name: Build (type generation)
        env:
          SKIP_ENV_VALIDATION: "1"
          DATABASE_URL: "file:./db.sqlite"
          AUTH_SECRET: "test-secret"
          AUTH_GITHUB_ID: "test-github-id"
          AUTH_GITHUB_SECRET: "test-github-secret"
          GITHUB_FEEDBACK_TOKEN: "test-token"
        run: npm run build
      - run: npm run typecheck
      - run: npm run check
      # Tests run against file:./db.sqlite (same path vitest.config.ts's test
      # env sets) but a fresh CI checkout has no schema in it — migrate first.
      - name: Migrate test database
        env:
          SKIP_ENV_VALIDATION: "1"
          DATABASE_URL: "file:./db.sqlite"
          AUTH_SECRET: "test-secret"
          AUTH_GITHUB_ID: "test-github-id"
          AUTH_GITHUB_SECRET: "test-github-secret"
          GITHUB_FEEDBACK_TOKEN: "test-token"
        run: npm run db:migrate
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      # Deploy-blocking visual regression gate: this one spec (not the whole
      # E2E suite, which stays local/ad hoc) runs the same way npm test does
      # via `needs: test` below. Playwright's own webServer.command builds
      # and starts the production server itself (see playwright.config.ts),
      # so no separate build step is needed here beyond what that command
      # already does. E2E_TEST_AUTH_SECRET/E2E_USERNAME are scoped to this
      # step only — see the narrowed security comment in
      # src/app/api/test-auth/login/route.ts.
      - name: Visual regression (deploy-blocking)
        env:
          SKIP_ENV_VALIDATION: "1"
          DATABASE_URL: "file:./db.sqlite"
          AUTH_SECRET: "test-secret"
          AUTH_GITHUB_ID: "test-github-id"
          AUTH_GITHUB_SECRET: "test-github-secret"
          GITHUB_FEEDBACK_TOKEN: "test-token"
          AUTH_TRUST_HOST: "true"
          E2E_TEST_AUTH_SECRET: "ci-only-test-secret"
          E2E_USERNAME: "e2e-visual-ci@example.com"
        run: npx playwright test tests/e2e/visual-regression.spec.ts
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key szef@217.154.238.241
