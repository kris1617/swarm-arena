# Composite action that runs tools/ai-reviewer against a PR diff (M5L3).
# Local composite action: `run:` steps execute with the repository's working
# directory by default, NOT this action's own directory — cd via
# $GITHUB_WORKSPACE (the documented, stable repo-root reference) rather than
# a relative path off github.action_path.
name: AI Reviewer
description: Run the team's AI code review agent (tools/ai-reviewer) on a pull request diff

inputs:
  api-key:
    description: Anthropic API key
    required: true
  pr-title:
    description: Pull request title
    required: true
  pr-body:
    description: Pull request description (optional; costs tokens)
    required: false
    default: ""
  diff-file:
    description: Path to a file with the PR diff (a file avoids step-output size and newline limits)
    required: true
  model:
    description: Model id passed to the reviewer
    required: false
    default: claude-sonnet-5-5

outputs:
  verdict:
    description: Parsed pass/fail verdict from the agent
    value: ${{ steps.agent.outputs.verdict }}
  review-file:
    description: Path to the full JSON ReviewResult
    value: ${{ steps.agent.outputs.review-file }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22

    - name: Run agent
      id: agent
      shell: bash
      # Untrusted PR text goes through env, never interpolated into the script.
      env:
        ANTHROPIC_API_KEY: ${{ inputs.api-key }}
        PR_TITLE: ${{ inputs.pr-title }}
        PR_BODY: ${{ inputs.pr-body }}
        DIFF_FILE: ${{ inputs.diff-file }}
        REVIEW_MODEL: ${{ inputs.model }}
      run: |
        set -euo pipefail
        cd "$GITHUB_WORKSPACE/tools/ai-reviewer"
        npm ci
        review_file="$RUNNER_TEMP/ai-review.json"
        npx tsx src/review.ts > "$review_file"
        verdict=$(node -e 'const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); if (!["pass", "fail"].includes(r.verdict)) process.exit(1); console.log(r.verdict)' "$review_file")
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
        echo "review-file=$review_file" >> "$GITHUB_OUTPUT"
